# Settings for `cargo audit`, run by CI's dependency audit job.

[advisories]
# zip 4.x comes only from tauri-plugin-updater (2.14.0, its latest release).
# These flaws need an attacker-crafted archive, and the updater extracts
# only bundles whose minisign signature it has already verified against our
# public key. Remove once the plugin depends on zip >= 9.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
