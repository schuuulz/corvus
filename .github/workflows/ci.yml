# Full checks for what reaches main (dev -> main PRs, release PRs and pushes
# to main): type-check, frontend build and the Rust test suite on Linux and
# Windows. Feature PRs into dev only get the secret scan (secrets.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    # A run normally takes a few minutes; a hung step fails instead of
    # blocking for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Ubuntu mirrors occasionally hang: retry, and give up after 5 minutes.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Git identity for tests
        run: |
          git config --global user.name "Corvus CI"
          git config --global user.email "ci@corvus.invalid"
          git config --global init.defaultBranch main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
