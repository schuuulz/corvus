# Release pipeline.
#
# On every push to main, release-please keeps a "release x.y.z" PR up to date
# (version bump in package.json, tauri.conf.json, Cargo.toml/Cargo.lock and
# CHANGELOG.md, derived from Conventional Commits). Merging that PR tags
# vX.Y.Z and creates the GitHub Release. Then:
# - build attaches the installers for Windows, Linux and macOS, signed when
#   signing is configured (docs/SIGNING.md), plus the in-app updater bundles;
# - release-manifests writes latest.json (the updater's manifest) and
#   SHA256SUMS.txt once every installer is attached;
# - sync-dev merges main back into dev so dev also carries the release commit.
#
# The build runs in this same workflow because tags created with
# GITHUB_TOKEN do not trigger other workflows.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            mac_arch: aarch64
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            mac_arch: x64
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Windows installers go through SignPath once it is configured
      # (docs/SIGNING.md); until then they are attached unsigned.
      SIGN_WINDOWS: ${{ matrix.name == 'windows-x64' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      # Exported only when set: Tauri treats an empty APPLE_CERTIFICATE as a
      # certificate and fails, so without the secrets the app stays unsigned.
      - name: Apple signing credentials
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<APPLE_EOF"; echo "${!name}"; echo "APPLE_EOF"; } >> "$GITHUB_ENV"
            fi
          done

      # Builds only: the installers are attached below, once signed if needed.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Adds the signed update bundles the in-app updater downloads.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node .github/scripts/collect-installers.mjs "$ARTIFACT_PATHS" dist "${{ matrix.mac_arch }}"

      - name: Upload unsigned Windows installers
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            dist/*.msi
            dist/*-setup.exe

      - name: Sign Windows installers (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Authenticode changes the files, so the updater signature of the
      # NSIS installer is made again from the signed one.
      - name: Use the signed Windows installers
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp signed/* dist/
          for installer in dist/*-setup.exe; do
            npx tauri signer sign "$installer"
          done

      - name: Attach installers to the release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  release-manifests:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest and checksums
        run: .github/scripts/release-manifests.sh "${{ needs.release-please.outputs.tag_name }}" "${{ needs.release-please.outputs.version }}"

  sync-dev:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin dev
