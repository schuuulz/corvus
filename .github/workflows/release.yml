# Release pipeline.
#
# On every push to main, release-please keeps a "release x.y.z" PR up to date
# (version bump in package.json, tauri.conf.json, Cargo.toml/Cargo.lock and
# CHANGELOG.md, derived from Conventional Commits). Merging that PR tags
# vX.Y.Z and creates the GitHub Release. Then:
# - build attaches the installers for Windows, Linux and macOS, signed when
#   signing is configured (docs/SIGNING.md), plus the in-app updater bundles;
# - release-manifests writes latest.json (the updater's manifest) and
#   SHA256SUMS.txt once every installer is attached;
# - sync-dev merges main back into dev so dev also carries the release commit.
#
# The build runs in this same workflow because tags created with
# GITHUB_TOKEN do not trigger other workflows.
#
# The build jobs hold the updater signing key, so they get no more than they
# need: actions pinned to commit SHAs, write access only where it is used,
# the token only on the step that uploads, no persisted git credentials and
# no caches another workflow could have written.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            mac_arch: aarch64
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            mac_arch: x64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
      # SignPath reads this job and downloads the unsigned artifact.
      actions: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Windows installers go through SignPath once it is configured
      # (docs/SIGNING.md); until then they are attached unsigned.
      SIGN_WINDOWS: ${{ matrix.name == 'windows-x64' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      # Not dist/: that is Vite's output, so it also holds the web assets.
      BUNDLE_DIR: release-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci

      # Exported only when set: Tauri treats an empty APPLE_CERTIFICATE as a
      # certificate and fails, so without the secrets the app stays unsigned.
      - name: Apple signing credentials
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<APPLE_EOF"; echo "${!name}"; echo "APPLE_EOF"; } >> "$GITHUB_ENV"
            fi
          done

      # Builds only: the installers are attached below, once signed if needed.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Adds the signed update bundles the in-app updater downloads.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: node .github/scripts/collect-installers.mjs "$ARTIFACT_PATHS" "$BUNDLE_DIR" "$MAC_ARCH"

      - name: Upload unsigned Windows installers
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: |
            ${{ env.BUNDLE_DIR }}/*.msi
            ${{ env.BUNDLE_DIR }}/*-setup.exe

      - name: Sign Windows installers (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Authenticode changes the files, so the updater signature of the
      # NSIS installer is made again from the signed one.
      - name: Use the signed Windows installers
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp signed/* "$BUNDLE_DIR"/
          for installer in "$BUNDLE_DIR"/*-setup.exe; do
            npx tauri signer sign "$installer"
          done

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$BUNDLE_DIR"/* --clobber

  release-manifests:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Update manifest and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: .github/scripts/release-manifests.sh "$TAG" "$VERSION"

  sync-dev:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin dev
